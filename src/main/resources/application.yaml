spring:
  datasource:
    url: jdbc:mysql://localhost:3306/botornot_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update # 테이블이 없으면 자동으로 만들어주는 설정
    show-sql: true # 실행되는 쿼리를 콘솔에 보여줌
    properties:
      hibernate:
        format_sql: true